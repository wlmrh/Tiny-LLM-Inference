<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="760" viewBox="0 0 1520 760" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">Tiny-LLM-Inference architecture</title>
  <desc id="diagram-desc">A fixed-layout diagram showing LLMEngine input processing, EngineCore scheduling and model execution, the shared paged KV cache, and output processing.</desc>
  <defs>
    <marker id="arrow-call" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#334155"/></marker>
    <marker id="arrow-data" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#2563EB"/></marker>
    <marker id="arrow-storage" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#16A34A"/></marker>
  </defs>
  <style>
    .canvas-background { fill: #FFFFFF; }
    text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #0F172A; }
    .engine-group { fill: #F8FBFF; stroke: #60A5FA; stroke-width: 2; }
    .core-group { fill: #FAF5FF; stroke: #A78BFA; stroke-width: 2; }
    .scheduling-group { fill: #FCFAFF; stroke: #DDD6FE; stroke-width: 1.5; }
    .execution-group { fill: #FFFBEB; stroke: #FED7AA; stroke-width: 1.5; }
    .entry-node { fill: #EFF6FF; stroke: #2563EB; stroke-width: 2; }
    .frontend-node { fill: #F8FAFC; stroke: #64748B; stroke-width: 2; }
    .runtime-node { fill: #F5F3FF; stroke: #7C3AED; stroke-width: 2; }
    .execution-node { fill: #FFF7ED; stroke: #EA580C; stroke-width: 2; }
    .storage-node { fill: #F0FDF4; stroke: #16A34A; stroke-width: 2; }
    .engine-title { fill: #1E3A8A; font-size: 21px; font-weight: 500; }
    .engine-subtitle { fill: #1E3A8A; font-size: 16px; font-weight: 400; }
    .core-title { fill: #334155; font-size: 18px; font-weight: 500; }
    .core-subtitle, .stage-title, .lane-title { fill: #475569; font-size: 15px; font-weight: 400; }
    .node-title { font-size: 17px; font-weight: 500; }
    .node-subtitle { font-size: 14px; font-weight: 500; }
    .call-flow, .data-flow, .storage-flow { fill: none; stroke-linecap: round; stroke-width: 2; }
    .call-flow { stroke: #334155; }
    .data-flow { stroke: #2563EB; stroke-dasharray: 7 6; }
    .storage-flow { stroke: #16A34A; }
  </style>

  <!-- Keep the diagram readable when embedded on dark or colored pages. -->
  <rect width="1520" height="760" class="canvas-background"/>

  <!-- Ownership groups use fixed coordinates so edge changes never relayout the diagram. -->
  <rect x="30" y="125" width="1460" height="600" rx="16" class="engine-group"/>
<text x="760" y="154" class="engine-title" text-anchor="middle">LLMEngine</text>
<text x="760" y="177" class="engine-subtitle" text-anchor="middle">Text ↔ token boundary</text>
  <rect x="370" y="190" width="780" height="495" rx="14" class="core-group"/>
<text x="760" y="217" class="core-title" text-anchor="middle">EngineCore</text>
<text x="760" y="239" class="core-subtitle" text-anchor="middle">schedule → run → update</text>
  <rect x="405" y="250" width="330" height="400" rx="12" class="scheduling-group"/>
<text x="570" y="276" class="stage-title" text-anchor="middle">Scheduling</text>
  <rect x="785" y="250" width="330" height="400" rx="12" class="execution-group"/>
<text x="950" y="276" class="stage-title" text-anchor="middle">ModelRunner</text>
<text x="190" y="348" class="lane-title" text-anchor="middle">Input processing</text>
<text x="1330" y="348" class="lane-title" text-anchor="middle">Output processing</text>

  <!-- Orthogonal runtime flow. Group-level arrows are mediated by EngineCore. -->
  <line x1="760" y1="100" x2="760" y2="125" class="call-flow" marker-end="url(#arrow-call)"/>
  <line x1="315" y1="406" x2="405" y2="406" class="data-flow" marker-end="url(#arrow-data)"/>
  <line x1="735" y1="406" x2="785" y2="406" class="data-flow" marker-start="url(#arrow-data)" marker-end="url(#arrow-data)"/>
  <line x1="1115" y1="406" x2="1205" y2="406" class="data-flow" marker-end="url(#arrow-data)"/>
  <line x1="570" y1="353" x2="570" y2="385" class="call-flow" marker-end="url(#arrow-call)"/>
  <line x1="570" y1="453" x2="570" y2="500" class="storage-flow" marker-end="url(#arrow-storage)"/>
  <line x1="950" y1="353" x2="950" y2="385" class="call-flow" marker-end="url(#arrow-call)"/>
  <path d="M 900 453 V 469 H 872 V 485" class="storage-flow" marker-start="url(#arrow-storage)" marker-end="url(#arrow-storage)"/>
  <path d="M 1000 453 V 469 H 1028 V 485" class="data-flow" marker-end="url(#arrow-data)"/>

  <!-- Executable components and the two views of one scheduler-owned KV cache. -->
  <g id="llm">
    <rect x="685" y="30" width="150" height="70" rx="10" class="entry-node"/>
    <text x="760" y="59" class="node-title" text-anchor="middle">LLM</text>
    <text x="760" y="82" class="node-subtitle" text-anchor="middle">Offline C++ API</text>
  </g>
  <g id="input-preprocessor">
    <rect x="65" y="370" width="250" height="72" rx="10" class="frontend-node"/>
    <text x="190" y="400" class="node-title" text-anchor="middle">InputPreprocessor</text>
    <text x="190" y="423" class="node-subtitle" text-anchor="middle">prompt → EngineCoreRequest</text>
  </g>
  <g id="scheduler">
    <rect x="435" y="285" width="270" height="68" rx="10" class="runtime-node"/>
    <text x="570" y="313" class="node-title" text-anchor="middle">Scheduler</text>
    <text x="570" y="336" class="node-subtitle" text-anchor="middle">queues · prefill/decode · preemption</text>
  </g>
  <g id="kv-cache-manager">
    <rect x="435" y="385" width="270" height="68" rx="10" class="runtime-node"/>
    <text x="570" y="413" class="node-title" text-anchor="middle">KVCacheManager</text>
    <text x="570" y="436" class="node-subtitle" text-anchor="middle">allocate · release</text>
  </g>
  <g id="paged-kv-cache-owner-view">
    <path d="M 435 511 C 435 496 705 496 705 511 L 705 579 C 705 594 435 594 435 579 Z" class="storage-node"/>
    <ellipse cx="570" cy="511" rx="135" ry="11" class="storage-node"/>
    <text x="570" y="539" class="node-title" text-anchor="middle">Paged KV cache</text>
    <text x="570" y="562" class="node-subtitle" text-anchor="middle">block tables · K/V blocks</text>
  </g>
  <g id="model-runner">
    <rect x="815" y="285" width="270" height="68" rx="10" class="execution-node"/>
    <text x="950" y="313" class="node-title" text-anchor="middle">ModelRunner</text>
    <text x="950" y="336" class="node-subtitle" text-anchor="middle">SchedulerOutput → ModelRunnerOutput</text>
  </g>
  <g id="model">
    <rect x="815" y="385" width="270" height="68" rx="10" class="execution-node"/>
    <text x="950" y="413" class="node-title" text-anchor="middle">LlamaForCausalLM</text>
    <text x="950" y="436" class="node-subtitle" text-anchor="middle">decoder layers · PagedAttention</text>
  </g>
  <g id="sampler">
    <rect x="955" y="485" width="145" height="90" rx="10" class="execution-node"/>
    <text x="1027.5" y="524" class="node-title" text-anchor="middle">Sampler</text>
    <text x="1027.5" y="547" class="node-subtitle" text-anchor="middle">greedy · top-k/p</text>
  </g>
  <g id="paged-kv-cache-attention-view">
    <path d="M 800 496 C 800 481 945 481 945 496 L 945 564 C 945 579 800 579 800 564 Z" class="storage-node"/>
    <ellipse cx="872.5" cy="496" rx="72.5" ry="11" class="storage-node"/>
    <text x="872.5" y="524" class="node-title" text-anchor="middle">Paged KV cache</text>
    <text x="872.5" y="547" class="node-subtitle" text-anchor="middle">attention K/V</text>
  </g>
  <g id="output-preprocessor">
    <rect x="1205" y="370" width="250" height="72" rx="10" class="frontend-node"/>
    <text x="1330" y="400" class="node-title" text-anchor="middle">OutPreprocessor</text>
    <text x="1330" y="423" class="node-subtitle" text-anchor="middle">EngineCoreOutput → UserOutput</text>
  </g>
</svg>
