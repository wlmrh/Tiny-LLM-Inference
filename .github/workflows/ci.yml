name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-dev.txt
          sudo apt-get update
          sudo apt-get install -y clang-format-14
      - name: Check formatting
        run: |
          find include src tests tools examples benchmark -type f \( -name '*.h' -o -name '*.cpp' -o -name '*.cu' \) -print0 \
            | xargs -0 clang-format-14 --dry-run --Werror
      - name: Check Python syntax
        run: python -m compileall -q benchmark scripts
      - name: Test benchmark utilities
        run: python -m unittest discover -s benchmark/tests -p 'test_*.py'
      - name: Configure
        run: cmake --preset ci-cpu
      - name: Build
        run: cmake --build --preset ci-cpu --parallel 2
      - name: Test
        run: ctest --preset ci-cpu
